schema: spec-driven

context: |
  # Ревью Python-файла агентом — контекст проекта

  ## Продукт
  Человек перетаскивает один файл `.py` на страницу. Бэкенд на FastAPI достаёт текст, агент
  на Deep Agents с моделью GigaChat прогоняет `ruff` и `ty` как инструменты, делает логический
  разбор кода и возвращает одним ответом ревью с находками по строкам, находки линтеров
  и цепочку рассуждений. Страница на чистых HTML, CSS и JS показывает код с подсветкой строк,
  находки и ленту рассуждений. Бэкенд ничего не хранит; модель и пределы — в `config.json`.

  ## Границы (менять нельзя без явного решения)
  In scope: страница с зоной перетаскивания и выбором файла; `POST /api/v1/review` с одним
  файлом `.py` в `multipart/form-data`; проверка расширения, размера и UTF-8; временный
  каталог на время запроса; инструменты `run_ruff` и `run_ty`; логический разбор агентом
  со структурированным ответом; цепочка рассуждений из следа агента; `GET /api/v1/config`
  и `GET /healthz`; `config.json` с секциями `llm`, `linters`, `limits`; светлая и тёмная
  тема по системной настройке (записи 0002, 0003, 0006–0008).

  Out of scope (не проектировать, не закладывать «на будущее»): хранение файлов, истории,
  учётных записей и сессий; несколько файлов, архивы, репозитории, PR и GitHub; правка кода
  за пользователя и скачивание исправленного файла; фреймворки, сборка и CDN на фронте;
  провайдеры моделей кроме GigaChat; оболочка, запись файлов и произвольный HTTP у модели;
  потоковая отдача шагов — отложена отдельным изменением после MVP (запись 0007).

  ## Внешние зависимости
  GigaChat через `langchain-gigachat`: OAuth по `GIGACHAT_CREDENTIALS` и `GIGACHAT_SCOPE`,
  цепочка сертификатов Минцифры в `GIGACHAT_CA_BUNDLE_FILE`, один вызов инструмента за ход,
  модели на ключе проекта перечислены в `openspec/notes/gigachat.md`. Deep Agents:
  `create_deep_agent`, `FilesystemBackend` с allowlist чтения, middleware, субагенты
  (`openspec/notes/deepagents.md`). `ruff` и `ty` из окружения бэкенда.

  ## Поток запроса
  Страница → `POST /api/v1/review` → проверка файла → временный каталог с файлом →
  `create_deep_agent` с GigaChat из `config.json`, бэкендом чтения над каталогом
  и инструментами `run_ruff`, `run_ty` → модель ходит по инструментам по одному вызову за ход,
  коллектор пишет шаги и считает вызовы → структурированный ответ модели: итог, вердикт,
  находки → проверка строк по диапазону файла, обрезка до `limits.max_findings` → один JSON:
  `file`, `review`, `lint`, `reasoning`, `model`, `usage` → каталог удалён в `finally` →
  страница рисует код, находки и ленту рассуждений.

  ## Зоны кода
  `analysis` — находка, ревью, шаг рассуждения, промпт, инструменты, сборка агента;
  `linters` — порт `Linter`, адаптеры `ruff` и `ty`, временный каталог; `shared` — конфиг,
  настройки, лог, ошибки, адаптер модели; `entrypoints` — FastAPI-приложение, маршруты,
  статика. Стрелки указывают внутрь. Страница — `frontend/`: `index.html`, `styles.css`,
  `app.js`.

  ## Где записаны нормы
  Этот файл описывает продукт и границы скоупа и не дублирует нормы. Всё остальное:

  - инварианты `INV-*`, конвенции, стек и команды, точки расширения — `Rules/RULES.md`;
  - требования `FR-*`, `NFR-*` и блоки приёмки — `Rules/REQUIREMENTS.md`;
  - почему принято решение и по какому типу разобрана задача — `Rules/ADR/`;
  - контракт страницы и бэкенда — `openspec/notes/api-contract.md`;
  - ограничения GigaChat — `openspec/notes/gigachat.md`;
  - устройство Deep Agents — `openspec/notes/deepagents.md`;
  - порядок работ до MVP — `openspec/notes/mvp-plan.md`.

  При расхождении источником считается `Rules/`.

rules:
  proposal:
    - "Пиши на русском; идентификаторы, поля, эндпоинты, имена инструментов и коды — в оригинальном виде."
    - "Держи в пределах 400 слов: Why / What changes / Impact без воды."
    - "Явно указывай, какие части затрагивает изменение — analysis, linters, shared, entrypoints, frontend, config.json."
    - "Обязательна секция «Non-goals» со ссылкой на Out of scope; не вводи хранение, GitHub, второй провайдер и фреймворк на фронте даже «на будущее»."
    - "Свяжи изменение с кодами требований из `Rules/REQUIREMENTS.md` и блоком приёмки."
    - "Если изменение опирается на вывод линтера или форму ответа модели, сошлись на фикстуру в `tests/fixtures/`, а не на документацию."
  specs:
    - "Дельта-спека описывает только наблюдаемое поведение, не реализацию."
    - "Формулируй требования как `### Requirement:` плюс `#### Scenario:` в форме WHEN/THEN на русском."
    - "Каждое требование трассируется на код из `Rules/REQUIREMENTS.md` и на блок приёмки; нужного кода нет — заведи его там же."
    - "Для эндпоинта фиксируй метод, путь, тело, коды ответов и конверт ошибки; для инструмента агента — имя, модель аргументов, форму и предел длины ответа, ответ на неверный аргумент."
    - "Для страницы фиксируй состояния: пусто, файл над зоной, отправка, результат, ошибка — и что видно в каждом."
    - "Сценарии обязаны покрывать негативные пути: не `.py`, слишком большой, не UTF-8, пустой файл, линтер не уложился в таймаут, модель вызвала два инструмента за ход, превышен `max_tool_calls`, GigaChat недоступен, таймаут анализа."
    - "Требование, по которому бэкенд что-то хранит между запросами, сформулировано неверно (`INV-01`)."
  design:
    - "Создавай, если изменение затрагивает набор инструментов агента, промпт главного агента, форму находки или шага рассуждения, контракт API, модель конфига или структуру страницы."
    - "Для каждого введённого паттерна отвечай: что за это получаем и чего это стоит."
    - "Пройди по списку `INV-*` из `Rules/RULES.md` и укажи для каждого затронутого, что решение его не ломает."
    - "Для внешних вызовов описывай таймаут, политику повторов и что происходит при частичном отказе."
    - "Для каждого инструмента агента описывай, что он отдаёт модели при успехе, при неверном аргументе и при превышении порога длины."
    - "Ключи в артефакт не попадают — только имена переменных или плейсхолдеры (`INV-02`)."
    - "То, что действует за пределами изменения, переноси записью в `Rules/ADR/`, а не оставляй здесь."
  tasks:
    - "Задачи — атомарные шаги не длиннее 2 часов, в порядке исполнения."
    - "Группируй по частям: shared, linters, analysis, entrypoints, frontend, tests."
    - "Первой в цепочке идёт задача, снимающая неопределённость: фикстура вывода линтера или ответа модели прежде модели данных."
    - "Инструмент агента — отдельная задача с тестом на неверный аргумент."
    - "Правка контракта — задачи на бэкенд и на `frontend/` в одном изменении."
    - "Каждая группа завершается задачей проверки: какой командой или каким действием на странице убедиться, что критерий выполнен."

operations:
  apply:
    guidance:
      - "Соблюдай `Rules/RULES.md`: конвенции, команды и запреты записаны там и здесь не повторяются."
      - "Задачу сначала классифицируй и заведи запись в `Rules/ADR/` вызовом скилла `project-docs`."
      - "API Deep Agents, langchain-gigachat и FastAPI сверяй через context7 перед правкой кода."
      - "Ключ GigaChat в репозиторий не попадает: в тестах — фейк модели, в запуске — переменная окружения."
      - "Инструмент агента зовёт порт, а не адаптер; текст от модели не исполняется; временный каталог удаляется в `finally`."
      - "Фронт без зависимостей: три файла, никаких `<script src>` наружу."
      - "Перед коммитом — `make lint` и `make test`."
      - "Отмечай выполнение в `tasks.md`; резюме держи кратким."
  archive:
    guidance:
      - "Имя архивной папки начинается с даты архивации в формате `ГГГГ-ММ-ДД`."
      - "Перед архивацией сверься с блоками приёмки в `Rules/REQUIREMENTS.md`: какой из шести закрывает изменение."
      - "Требования, действующие дальше, должны быть в `Rules/REQUIREMENTS.md`, а сквозные решения — в `Rules/ADR/`; иначе они исчезнут вместе с архивом."
      - "Убедись, что изменение запушено и CI зелёный."
